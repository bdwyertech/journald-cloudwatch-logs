name: Go
on: [push]
jobs:
  test:
    name: Build
    strategy:
      matrix:
        go: ['1.24']
        # image: ['centos:7']
        image: ['bdwyertech/centos-xc:latest']
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Install Dependencies
        run: |
          # Leverage IUS Repository for latest version of GIT
          yum install -y https://repo.ius.io/ius-release-el7.rpm
          yum install -y openssl-devel systemd-devel gcc git236 wget
          ln -s /usr/include/systemd/ /opt/cross/aarch64-linux/include/systemd
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Git Info
        id: git
        run: |
          echo "SOURCE_NAME=${GITHUB_REF#refs/*/}" >> $GITHUB_OUTPUT
          echo "SOURCE_BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "SOURCE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Test
        env:
          GOFLAGS: '-mod=vendor'
          STATICCHECK_VERSION: '2025.1.1'
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          wget -qO- https://github.com/dominikh/go-tools/releases/download/${STATICCHECK_VERSION}/staticcheck_linux_amd64.tar.gz | tar zxf - --directory /usr/local/bin --strip-components=1 staticcheck/staticcheck
          go fmt $(go list ./... | grep -v /vendor/) | xargs -I {} -r /bin/sh -c "/bin/echo {} && exit 1"
          go vet $(go list ./... | grep -v /vendor/)
          staticcheck --version
          staticcheck $(go list ./... | grep -v /vendor/)
          go test -v -race $(go list ./... | grep -v /vendor/)

      - name: Run GoReleaser
        if: startsWith(github.ref, 'refs/tags/') && (matrix.go == 1.24)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release
          # key: ${{ secrets.GPG_CODE_SIGN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
